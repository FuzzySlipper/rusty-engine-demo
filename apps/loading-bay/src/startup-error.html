<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071012" />
    <title>Loading Bay — Startup Error</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #071012;
        color: #d6e4e5;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: clamp(2rem, 8vw, 6rem);
      }

      .eyebrow {
        color: #75d8d3;
        letter-spacing: 0.18em;
      }

      h1 {
        max-width: 22ch;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
      }

      p {
        max-width: 65ch;
        line-height: 1.6;
      }
    </style>
  </head>
  <body data-desktop-startup-error="true">
    <main>
      <p class="eyebrow">LOADING BAY DESKTOP</p>
      <h1>The installed application could not start</h1>
      <p id="desktop-startup-diagnostic">
        Loading Bay rejected an unavailable or invalid packaged resource before
        starting gameplay. Reinstall the exact reviewed package. Your existing
        saves were not changed.
      </p>
    </main>
  </body>
</html>
