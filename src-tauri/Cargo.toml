[package]
name = "loading-bay-desktop"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "loading_bay_desktop"
path = "src/lib.rs"

[[bin]]
name = "loading-bay-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
loading-bay-game = { path = "../rust/crates/loading-bay-game" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }

[lints]
workspace = true
