[workspace]
resolver = "2"
members = ["rust/crates/loading-bay-game"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
asset-catalog = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
asset-import = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
authored-scene = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
content-store = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-assets = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-time = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
core-voxel = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
engine-inspector = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
environment-authoring = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
gameplay-mechanics = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
voxel-annotation = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
voxel-convert = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "24339f37ad5734ea92392602ffc024ca2c7e2f13" }
