[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.rusty-engine]
repository = "https://github.com/FuzzySlipper/rusty-engine"
revision = "24339f37ad5734ea92392602ffc024ca2c7e2f13"
