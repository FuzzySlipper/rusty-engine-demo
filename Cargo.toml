[workspace]
resolver = "2"
members = ["rust/crates/loading-bay-game", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
asset-catalog = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
asset-import = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
authored-scene = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
content-store = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-assets = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-time = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
core-voxel = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
engine-inspector = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
environment-authoring = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
gameplay-mechanics = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
voxel-annotation = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
voxel-convert = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
voxel-object-runtime = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "d52c9b0f3287f21eea81d465871978a117750d0c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tungstenite = "0.28"
rustix = { version = "1.1.4", features = ["process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.rusty-engine]
repository = "https://github.com/FuzzySlipper/rusty-engine"
revision = "d52c9b0f3287f21eea81d465871978a117750d0c"
