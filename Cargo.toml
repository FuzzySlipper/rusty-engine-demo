[workspace]
resolver = "2"
members = ["rust/crates/loading-bay-game", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
asset-catalog = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
asset-import = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
authored-scene = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
content-store = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-assets = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-time = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
core-voxel = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
engine-inspector = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
environment-authoring = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
gameplay-mechanics = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
voxel-annotation = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
voxel-convert = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
voxel-object-runtime = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "ec82fd4242b0e7b63183da4272e85caece76713d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tungstenite = "0.28"
rustix = { version = "1.1.4", features = ["process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.rusty-engine]
repository = "https://github.com/FuzzySlipper/rusty-engine"
revision = "ec82fd4242b0e7b63183da4272e85caece76713d"
