[workspace]
resolver = "2"
members = ["rust/crates/loading-bay-game", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
gtk = "0.18"
rusty-engine = { path = "../rusty-engine/rust/crates/rusty-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tungstenite = "0.28"
rustix = { version = "1.1.4", features = ["process"] }
sha2 = "0.10"
hex = "0.4"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"
