[workspace]
resolver = "2"
members = ["rust/crates/loading-bay-game"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
asset-catalog = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
authored-scene = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
content-store = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
core-assets = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
core-time = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
engine-inspector = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
render-model = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
render-projection = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
voxel-asset = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "e462016d5cafe87ce1994d33f7791f41fa9bd727" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.rusty-engine]
repository = "https://github.com/FuzzySlipper/rusty-engine"
revision = "e462016d5cafe87ce1994d33f7791f41fa9bd727"
