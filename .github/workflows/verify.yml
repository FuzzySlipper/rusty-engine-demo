name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rusty Engine Demo
        uses: actions/checkout@v4

      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libxkbcommon-x11-0 \
            imagemagick \
            ripgrep \
            xvfb \
            xdotool \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete downstream product
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: pnpm run verify

  verify-tauri:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Rusty Engine Demo
        uses: actions/checkout@v4

      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libgtk-3-bin \
            librsvg2-dev \
            dbus-x11 \
            openbox \
            patchelf \
            xvfb \
            webkit2gtk-driver

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri WebDriver intermediary
        run: cargo install tauri-driver --locked --version 2.0.6

      - name: Verify native shell and process lifecycle
        env:
          TAURI_DRIVER_BIN: /home/runner/.cargo/bin/tauri-driver
          TAURI_WINDOW_MANAGER: /usr/bin/openbox
        run: dbus-run-session -- pnpm run verify:tauri
