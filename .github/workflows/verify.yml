name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Rusty Engine Demo
        uses: actions/checkout@v4

      - name: Provision adjacent Rusty Engine checkout
        id: engine
        run: |
          git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine
          echo "rev=$(git -C ../rusty-engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # The Engine sibling is consumed via a path dependency outside this
          # checkout, so its revision must participate in the cache key.
          key: engine-${{ steps.engine.outputs.rev }}

      - name: Install script dependencies
        # ripgrep: verify-rust.sh forbidden-dependency grep. The GTK/webkit
        # stack is required to BUILD the game crate on Linux: the complete
        # rusty-engine facade includes renderer-webview-host (wry ->
        # webkit2gtk -> javascriptcore/glib), and webkit2gtk-4.1's pkg-config
        # additionally requires gtk+-3.0 and libsoup-3.0. Removing this needs
        # an upstream Engine feature seam, not a downstream change.
        run: >
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y
          ripgrep libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxkbcommon-x11-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify downstream product (node and Rust checks)
        run: |
          pnpm run audit:boundary
          pnpm run typecheck
          pnpm run check:content
          pnpm run test:ts
          pnpm run test:platform
          pnpm run test:shell
          pnpm run test:engine-route
          pnpm run test:performance-tools
          pnpm run build:shell
          ./scripts/verify-rust.sh
